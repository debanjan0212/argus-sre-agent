name: db-pool-exhaustion
description: >
  checkout errors and latency are up while its CPU is low. Logs show requests timing out while
  waiting for a database connection. Scaling out would make the database worse, so the right
  move is to escalate, not to auto-fix.
alert:
  status: firing
  labels: {alertname: HighErrorRate, service: checkout, namespace: shop, severity: page}
  annotations: {summary: "checkout 5xx error rate above 5%"}
  startsAt: "2026-11-04T12:10:00Z"
expected: {category: dependency_failure, component: checkout, action: escalate}
data:
  alerts:
    - {labels: {alertname: HighErrorRate, service: checkout, namespace: shop}, state: firing}
  dependencies:
    checkout: [payments]
    payments: []
  golden_signals:
    checkout: {service: checkout, request_rate_rps: 70, error_rate: 0.11, error_rate_baseline: 0.002,
               p95_latency_ms: 5100, p95_latency_baseline_ms: 200, cpu_pct_of_limit: 22, memory_pct_of_limit: 47}
    payments: {service: payments, request_rate_rps: 38, error_rate: 0.001, error_rate_baseline: 0.001,
               p95_latency_ms: 90, p95_latency_baseline_ms: 92, cpu_pct_of_limit: 25, memory_pct_of_limit: 33}
  traces:
    checkout:
      - {trace_id: a3ce929d0e0e4736, duration_ms: 5020, slowest_span: {service: postgres, name: "SELECT orders", duration_ms: 4990}}
  workloads:
    checkout: {name: checkout, replicas: 3, ready: 3, restarts: 0, last_termination_reason: null,
               image: "argus-demo/shop:1.3.2", limits: {cpu: 500m, memory: 256Mi}}
  events:
    checkout: []
  rollouts:
    checkout:
      - {revision: 7, image: "argus-demo/shop:1.3.2", age_min: 2880}
  logs:
    checkout:
      - '{"level": "error", "message": "timeout acquiring connection from pool after 5000ms (size=10, in_use=10)"}'
      - '{"level": "error", "message": "timeout acquiring connection from pool after 5000ms (size=10, in_use=10)"}'
      - '{"level": "error", "message": "timeout acquiring connection from pool after 5000ms (size=10, in_use=10)"}'
      - '{"level": "error", "message": "POST /checkout failed with 503"}'
