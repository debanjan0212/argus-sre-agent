name: downstream-saturation
description: >
  frontend p95 latency is 6x normal. frontend and checkout look idle; traces show time spent in
  payments, which runs at 96% of its CPU limit with no errors and no release. Expected: scale
  payments from 2 to 4 replicas.
alert:
  status: firing
  labels: {alertname: HighLatencyP95, service: frontend, namespace: shop, severity: page}
  annotations: {summary: "frontend p95 latency above 1s for 10 minutes"}
  startsAt: "2026-11-03T18:20:00Z"
expected: {category: capacity_saturation, component: payments, action: scale_replicas}
data:
  alerts:
    - {labels: {alertname: HighLatencyP95, service: frontend, namespace: shop}, state: firing}
  dependencies:
    frontend: [checkout]
    checkout: [payments]
    payments: []
  golden_signals:
    frontend: {service: frontend, request_rate_rps: 310, error_rate: 0.004, error_rate_baseline: 0.003,
               p95_latency_ms: 1450, p95_latency_baseline_ms: 220, cpu_pct_of_limit: 34, memory_pct_of_limit: 40}
    checkout: {service: checkout, request_rate_rps: 160, error_rate: 0.003, error_rate_baseline: 0.002,
               p95_latency_ms: 1300, p95_latency_baseline_ms: 180, cpu_pct_of_limit: 29, memory_pct_of_limit: 38}
    payments: {service: payments, request_rate_rps: 150, error_rate: 0.002, error_rate_baseline: 0.002,
               p95_latency_ms: 1180, p95_latency_baseline_ms: 90, cpu_pct_of_limit: 96, memory_pct_of_limit: 52}
  traces:
    frontend:
      - {trace_id: 4bf92f3577b34da6, duration_ms: 1520, slowest_span: {service: payments, name: "POST /authorize", duration_ms: 1210}}
      - {trace_id: 00f067aa0ba902b7, duration_ms: 1395, slowest_span: {service: payments, name: "POST /authorize", duration_ms: 1102}}
      - {trace_id: 5b8aa5a2d2c872e8, duration_ms: 1610, slowest_span: {service: payments, name: "POST /authorize", duration_ms: 1330}}
  workloads:
    frontend: {name: frontend, replicas: 3, ready: 3, restarts: 0, last_termination_reason: null,
