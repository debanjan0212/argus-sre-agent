name: oom-kill
description: >
  payments pods keep restarting. They are OOMKilled at a 256Mi limit; there was no recent
  release. Expected: raise the memory limit to 512Mi (inside the 2x guardrail).
alert:
  status: firing
  labels: {alertname: PodRestarting, service: payments, namespace: shop, severity: page}
  annotations: {summary: "payments containers restarted 7 times in 30 minutes"}
  startsAt: "2026-11-02T03:40:00Z"
expected: {category: resource_exhaustion, component: payments, action: increase_memory_limit}
data:
  alerts:
    - {labels: {alertname: PodRestarting, service: payments, namespace: shop}, state: firing}
  dependencies:
    payments: []
  golden_signals:
    payments: {service: payments, request_rate_rps: 40, error_rate: 0.08, error_rate_baseline: 0.001,
               p95_latency_ms: 140, p95_latency_baseline_ms: 95, cpu_pct_of_limit: 41, memory_pct_of_limit: 97}
  traces:
    payments: []
  workloads:
    payments: {name: payments, replicas: 2, ready: 1, restarts: 7, last_termination_reason: OOMKilled,
               image: "argus-demo/shop:1.3.2", limits: {cpu: 500m, memory: 256Mi}}
  events:
    payments:
      - {type: Warning, reason: BackOff, message: "Back-off restarting failed container payments", count: 9, age_min: 2}
      - {type: Warning, reason: OOMKilling, message: "Memory cgroup out of memory: Killed process 1 (python)", count: 7, age_min: 3}
  rollouts:
    payments:
      - {revision: 4, image: "argus-demo/shop:1.3.2", age_min: 4320}
  logs:
    payments:
      - '{"level": "info", "message": "loaded fraud model into memory (182MB)"}'
      - '{"level": "error", "message": "worker killed: signal 9"}'
      - '{"level": "error", "message": "worker killed: signal 9"}'
