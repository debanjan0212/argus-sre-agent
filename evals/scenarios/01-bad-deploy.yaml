name: bad-deploy
description: >
  Users see 5xx on the frontend. The real cause is two hops away: a checkout release
  rolled out 7 minutes earlier throws on a missing field. Expected: trace down to checkout,
  roll back to the previous image.
alert:
  status: firing
  labels: {alertname: HighErrorRate, service: frontend, namespace: shop, severity: page}
  annotations: {summary: "frontend 5xx error rate is above 5% for 5 minutes"}
  startsAt: "2026-11-01T10:05:00Z"
expected: {category: bad_deploy, component: checkout, action: rollback_image}
data:
  alerts:
    - {labels: {alertname: HighErrorRate, service: frontend, namespace: shop}, state: firing}
  dependencies:
    frontend: [checkout]
    checkout: [payments]
  golden_signals:
    frontend: {service: frontend, request_rate_rps: 120, error_rate: 0.18, error_rate_baseline: 0.002,
               p95_latency_ms: 210, p95_latency_baseline_ms: 190, cpu_pct_of_limit: 31, memory_pct_of_limit: 44}
    checkout: {service: checkout, request_rate_rps: 64, error_rate: 0.33, error_rate_baseline: 0.001,
               p95_latency_ms: 160, p95_latency_baseline_ms: 150, cpu_pct_of_limit: 38, memory_pct_of_limit: 41}
    payments: {service: payments, request_rate_rps: 41, error_rate: 0.001, error_rate_baseline: 0.001,
               p95_latency_ms: 95, p95_latency_baseline_ms: 92, cpu_pct_of_limit: 27, memory_pct_of_limit: 35}
  traces:
    frontend: []
  workloads:
    frontend: {name: frontend, replicas: 3, ready: 3, restarts: 0, last_termination_reason: null,
               image: "argus-demo/shop:1.3.2", limits: {cpu: 500m, memory: 256Mi}}
    checkout: {name: checkout, replicas: 3, ready: 3, restarts: 0, last_termination_reason: null,
               image: "argus-demo/shop:1.4.0", limits: {cpu: 500m, memory: 256Mi}}
  events:
    checkout:
      - {type: Normal, reason: ScalingReplicaSet, message: "Scaled up replica set checkout-7d9f to 3", count: 1, age_min: 7}
  rollouts:
    checkout:
      - {revision: 7, image: "argus-demo/shop:1.3.2", age_min: 2880}
      - {revision: 8, image: "argus-demo/shop:1.4.0", age_min: 7}
  logs:
    checkout:
      - '{"level": "error", "message": "KeyError: ''currency'' in POST /checkout (order_id=8812)"}'
      - '{"level": "error", "message": "KeyError: ''currency'' in POST /checkout (order_id=8813)"}'
      - '{"level": "error", "message": "KeyError: ''currency'' in POST /checkout (order_id=8820)"}'
      - '{"level": "error", "message": "payment client init failed api_key=sk_live_51HxYzQ2abc"}'
      - '{"level": "info", "message": "GET /healthz 200"}'
