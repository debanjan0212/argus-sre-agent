apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  labels:
    app: checkout
    app.kubernetes.io/part-of: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/part-of: shop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: checkout
        image: argus-demo/shop:1.3.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: checkout
        - name: DOWNSTREAM_URL
          value: http://payments:8080/
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.monitoring:4318
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
  labels:
    app: checkout
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: checkout
  ports:
  - name: http
    port: 8080
    targetPort: http
